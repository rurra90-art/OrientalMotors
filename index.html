<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="265 repuestos Hyundai y Kia en 5 cajas. Fotos, OEM, medidas y aplicaciones.">
<meta property="og:title" content="Catálogo Remate Oriental">
<meta property="og:description" content="265 repuestos Hyundai y Kia en 5 cajas. Fotos, OEM, medidas y aplicaciones.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rurra90-art.github.io/OrientalMotors/">

<title>Catálogo Remate Oriental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bodega de repuestos. Barra de cajas arriba, grilla de fichas con etiqueta de codigo tipo rotulo de bin, ficha completa en panel lateral. */
:root {
  --bg: #eef0ee;
  --surface: #ffffff;
  --ink: #1b2129;
  --muted: #5c6672;
  --line: #d5d9d6;
  --steel: #2d5a84;
  --label: #f2c230;
  --label-ink: #1b2129;
  --ok: #2e7d4f;
  --warn: #b26b00;
  --bad: #b23a3a;
  --ph: #e2e5e2;
  --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 4px 14px rgba(20, 30, 40, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1c2229; --ink: #e6e9ec; --muted: #9aa4ae; --line: #2e363f; --steel: #7fb0dc;
    --label: #e6b625; --label-ink: #15191e; --ok: #5cbf86; --warn: #e3a447; --bad: #e07a7a; --ph: #232a32;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1c2229; --ink: #e6e9ec; --muted: #9aa4ae; --line: #2e363f; --steel: #7fb0dc;
  --label: #e6b625; --label-ink: #15191e; --ok: #5cbf86; --warn: #e3a447; --bad: #e07a7a; --ph: #232a32;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 3px solid var(--ink); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
.stamp { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
.stamp b { color: var(--ink); font-weight: 600; }

.lotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 18px; }
.lote { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; }
.lote:hover { border-color: var(--steel); }
.lote:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .card:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
.lote[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--label); }
.lote .n { font-family: var(--f-display); font-weight: 600; font-size: 19px; text-transform: uppercase; line-height: 1.1; }
.lote .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--ph); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 14px; }
.tools input[type=search] { flex: 1 1 260px; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tools select { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; font: inherit; color: inherit; padding: 0; }
.card:hover { box-shadow: var(--shadow); border-color: var(--steel); }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--ph); display: grid; place-items: center; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.ph .none { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: grid; justify-items: center; gap: 6px; }
.ph .nf { position: absolute; right: 8px; bottom: 8px; font-family: var(--f-mono); font-size: 11px; background: rgba(20, 25, 30, .72); color: #fff; padding: 2px 6px; border-radius: 3px; }
.tag { font-family: var(--f-mono); font-weight: 600; font-size: 13px; background: var(--label); color: var(--label-ink); padding: 3px 8px; border-radius: 2px; letter-spacing: .02em; justify-self: start; word-break: break-all; }
.body { padding: 12px 14px 14px; display: grid; gap: 7px; flex: 1; align-content: start; }
.desc { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--line); font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-family: var(--f-body); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

dialog { border: none; padding: 0; width: min(980px, 100vw); max-width: 100vw; max-height: 100%; height: 100%; margin: 0 0 0 auto; background: var(--surface); color: var(--ink); box-shadow: -10px 0 40px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(10, 14, 18, .55); }
.dl { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100%; }
.gal { background: var(--ph); padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 10px; align-content: start; }
.gal .big { aspect-ratio: 1 / 1; max-width: 100%; background: #fff; border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
.gal .big img { width: 100%; height: 100%; object-fit: contain; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs button { width: 64px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 4px; background: #fff; cursor: pointer; overflow: hidden; }
.thumbs button[aria-current="true"] { border-color: var(--steel); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.info { padding: 18px 20px 28px; padding-top: max(18px, env(safe-area-inset-top, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; min-width: 0; }
.info h2 { font-family: var(--f-display); font-size: 28px; line-height: 1.05; text-transform: uppercase; margin: 0; text-wrap: balance; }
.close { justify-self: end; font: inherit; font-size: 14px; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.sec h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
.oems { display: flex; flex-wrap: wrap; gap: 6px; }
.oems span { font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); border-radius: 3px; padding: 2px 7px; }
.apl { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; max-height: 260px; overflow: auto; }
.apl li { padding: 5px 8px; background: var(--bg); border-radius: 3px; }
.interno { border: 1px dashed var(--warn); border-radius: 6px; padding: 12px 14px; }
.interno h3 { color: var(--warn); }
@media (max-width: 760px) {
  .dl { grid-template-columns: minmax(0, 1fr); }
  .gal .big { aspect-ratio: 4 / 3; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: box-shadow .15s, border-color .15s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="titulo">Catálogo Remate Oriental</h1>
      <div class="sub" id="sub">Cargando productos…</div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <nav class="lotes" id="lotes" aria-label="Cajas"></nav>

  <div class="tools">
    <input id="q" type="search" placeholder="Buscar por código, OEM, descripción o vehículo" aria-label="Buscar">
    <select id="cat" aria-label="Categoría"><option value="">Todas las categorías</option></select>
    <select id="veh" aria-label="Vehículo"><option value="">Todos los vehículos</option></select>
    <label class="chk"><input id="conFoto" type="checkbox"> Solo con foto</label>
    <select id="val" aria-label="Validación" hidden><option value="">Validados y pendientes</option><option value="si">Solo validados</option><option value="no">Solo pendientes</option></select>
  </div>
  <div class="count" id="count"></div>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden>No hay productos con ese filtro.</div>
</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dl">
    <div class="gal"><div class="big" id="dBig"></div><div class="thumbs" id="dThumbs"></div></div>
    <div class="info" id="dInfo"></div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n || 0).toLocaleString('es-CL');
const pesos = (n) => '$' + fmt(n);
const mm = (n) => n >= 1e6 ? '$' + (n / 1e6).toLocaleString('es-CL', {maximumFractionDigits: 1}) + ' M' : pesos(n);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
let D, ITEMS = [], INT = false, caja = '';

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function iconoCaja() {
  return '<svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><path d="M3 9 17 3l14 6v12l-14 6-14-6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9l14 6 14-6M17 15v12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
}

function estado(i) {
  if (!INT) return '';
  if (i.decision) return '<span class="pill ok">' + esc(i.decision) + '</span>';
  if (/baja/i.test(i.observacion)) return '<span class="pill bad">Validar baja</span>';
  return i.validado ? '<span class="pill ok">Validado</span>' : '<span class="pill warn">Pendiente</span>';
}

function lotes() {
  const cajas = D.cajas.map((c) => {
    const g = ITEMS.filter((i) => i.caja === c);
    return {c, n: g.length, foto: g.filter((i) => i.fotos.length).length, u: g.reduce((s, i) => s + i.unidades, 0),
      val: g.filter((i) => i.validado).length, costo: g.reduce((s, i) => s + (i.costo_chena || 0), 0)};
  });
  const tot = {c: '', n: ITEMS.length, foto: ITEMS.filter((i) => i.fotos.length).length, u: ITEMS.reduce((s, i) => s + i.unidades, 0),
    val: ITEMS.filter((i) => i.validado).length, costo: ITEMS.reduce((s, i) => s + (i.costo_chena || 0), 0)};
  $('lotes').innerHTML = [tot, ...cajas].map((x) => {
    const pct = x.n ? (INT ? x.val : x.foto) / x.n : 0;
    const k = INT
      ? fmt(x.n) + ' códigos · ' + Math.round(x.val / x.n * 100) + '% validado<br>' + mm(x.costo) + ' en Chena · ' + fmt(x.foto) + ' con foto'
      : fmt(x.n) + ' productos · ' + fmt(x.u) + ' unidades<br>' + fmt(x.foto) + ' con foto';
    return '<button class="lote" data-c="' + esc(x.c) + '" aria-pressed="' + (caja === x.c) + '"><span class="n">' + esc(x.c || 'Todas las cajas') + '</span><span class="k">' + k + '</span>' +
      '<span class="bar" title="' + (INT ? 'Validado' : 'Con foto') + '"><i style="width:' + Math.round(pct * 100) + '%"></i></span></button>';
  }).join('');
  $('lotes').querySelectorAll('.lote').forEach((b) => b.addEventListener('click', () => { caja = b.dataset.c; store('caja', caja); lotes(); pintar(); }));
}

function opciones(sel, vals) {
  [...new Set(vals.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es')).forEach((v) => sel.append(new Option(v, v)));
}

function filtrar() {
  const q = norm($('q').value).trim().split(/\s+/).filter(Boolean);
  const cat = $('cat').value, veh = $('veh').value, cf = $('conFoto').checked, val = $('val').value;
  return ITEMS.filter((i) => (!caja || i.caja === caja) && (!cat || i.categoria === cat) && (!veh || i.vehiculo === veh) &&
    (!cf || i.fotos.length) && (!val || (val === 'si') === !!i.validado) && q.every((w) => i._t.includes(w)));
}

function pintar() {
  const L = filtrar();
  $('count').textContent = fmt(L.length) + ' de ' + fmt(ITEMS.length) + ' productos';
  $('empty').hidden = L.length > 0;
  $('grid').innerHTML = L.map((i, k) => {
    const foto = i.fotos.length
      ? '<img src="' + esc(i.fotos[0]) + '" alt="' + esc(i.descripcion) + '" loading="lazy">' + (i.fotos.length > 1 ? '<span class="nf">' + i.fotos.length + ' fotos</span>' : '')
      : '<span class="none">' + iconoCaja() + 'Foto pendiente</span>';
    const meta = [i.marca, i.procedencia].filter(Boolean).map(esc).join(' · ');
    const pie = INT
      ? '<span>' + fmt(i.unidades) + ' u · ' + mm(i.costo_chena) + '</span>' + estado(i)
      : '<span>' + fmt(i.unidades) + ' unidades</span><span>' + esc(i.caja) + '</span>';
    return '<button class="card" data-k="' + ITEMS.indexOf(i) + '"><div class="ph">' + foto + '</div><div class="body"><span class="tag">' + esc(i.codigo) + '</span>' +
      '<div class="desc">' + esc(i.descripcion) + '</div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') +
      (i.vehiculo ? '<div class="meta">' + esc(i.vehiculo) + (i.categoria ? ' · ' + esc(i.categoria) : '') + '</div>' : '') +
      '<div class="foot">' + pie + '</div></div></button>';
  }).join('');
}

function abrir(i) {
  const big = $('dBig'), th = $('dThumbs');
  const ver = (k) => {
    big.innerHTML = i.fotos.length ? '<img src="' + esc(i.fotos[k]) + '" alt="' + esc(i.descripcion) + ', foto ' + (k + 1) + '">' : '<span class="ph none" style="background:none">' + iconoCaja() + 'Foto pendiente</span>';
    th.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-current', j === k));
  };
  th.innerHTML = i.fotos.length > 1 ? i.fotos.map((f, k) => '<button aria-label="Foto ' + (k + 1) + '"><img src="' + esc(f) + '" alt="" loading="lazy"></button>').join('') : '';
  th.querySelectorAll('button').forEach((b, k) => b.addEventListener('click', () => ver(k)));
  ver(0);
  const dato = [['Marca', i.marca], ['Procedencia', i.procedencia], ['Vehículo', i.vehiculo], ['Categoría', [i.categoria, i.subcategoria].filter(Boolean).join(' / ')],
    ['Unidades', fmt(i.unidades)], ['Caja', i.caja]].filter((x) => x[1]);
  const kv = (rows) => '<dl class="kv">' + rows.map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
  let h = '<button class="close" id="cerrar">Cerrar</button><div style="display:grid;gap:8px"><span class="tag">' + esc(i.codigo) + '</span><h2 id="dTitle">' + esc(i.descripcion) + '</h2></div>';
  h += '<div class="sec"><h3>Producto</h3>' + kv(dato) + '</div>';
  if (i.oem.length) h += '<div class="sec"><h3>Número OEM</h3><div class="oems">' + i.oem.map((o) => '<span>' + esc(o) + '</span>').join('') + '</div></div>';
  if (i.medidas.length) h += '<div class="sec"><h3>Datos técnicos</h3>' + kv(i.medidas) + '</div>';
  if (i.equivalencias.length) h += '<div class="sec"><h3>Equivalencias</h3>' + kv(i.equivalencias) + '</div>';
  h += '<div class="sec"><h3>Aplicaciones (' + i.aplicaciones.length + ')</h3>' + (i.aplicaciones.length ? '<ul class="apl">' + i.aplicaciones.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '<div class="meta">Sin aplicaciones cargadas en el ERP.</div>') + '</div>';
  if (INT) {
    h += '<div class="sec interno"><h3>Interno · no se muestra a compradores</h3>' + kv([['Estado', i.decision || (i.validado ? 'Validado en Chena' : 'Pendiente de validar')],
      ['OEM en la pieza', i.oem_validado], ['Observación', i.observacion], ['Ubicación Chena', i.ubicacion], ['Criticidad', i.criticidad], ['Motivo', i.motivo],
      ['Días sin mover', i.dias_sin_mover != null ? fmt(i.dias_sin_mover) : ''], ['Costo unitario', pesos(i.costo_unitario)], ['Costo en Chena', pesos(i.costo_chena)]].filter((x) => x[1])) + '</div>';
  }
  $('dInfo').innerHTML = h;
  $('cerrar').addEventListener('click', () => $('dlg').close());
  if (!$('dlg').open) $('dlg').showModal();
  $('dInfo').scrollTop = 0;
}

$('grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) abrir(ITEMS[+c.dataset.k]); });
